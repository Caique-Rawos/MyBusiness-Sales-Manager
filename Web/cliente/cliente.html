<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      .is-invalid {
        border-color: #dc3545 !important;
      }
    </style>

    <script>
      function getValue(paramName) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(paramName);
      }

      function isIntegerString(value) {
        if (value === null) return false;

        return /^-?\d+$/.test(value);
      }

      function mensagemErro(msg) {
        if (msg == "") {
          msg = "Erro Desconhecido";
        }
        Swal.fire({
          title: "Erro!",
          text: msg,
          icon: "error",
          confirmButtonText: "Ok",
        });
      }

      function edicao(idCliente) {
        var baseUrl = window.location.origin + window.location.pathname;
        var newUrl = baseUrl + "?r=cliente&id_cliente=" + idCliente;
        window.location.href = newUrl;
      }

      function telaCadatro() {
        var baseUrl = window.location.origin + window.location.pathname;
        var newUrl = baseUrl + "?r=cliente";
        window.location.href = newUrl;
      }

      function carregaClienteToEdit() {
        $(document).ready(function () {
          const idCliente = getValue("id_cliente");

          if (isIntegerString(idCliente)) {
            $.ajax({
              type: "GET",
              url:
                "./api/requisicao/cliente/buscaClienteById.php?id_cliente=" +
                idCliente,
              success: function (data) {
                if (data) {
                  const jsonData = JSON.parse(data);

                  $("#codigo").val(jsonData.id);
                  $("#nome").val(jsonData.nome);
                  $("#cpfCnpj").val(jsonData.cpfCnpj);
                  $("#observacao").val(jsonData.observacao);
                  $("#botaoSubmit").html("Atualizar");
                }
              },
              error: function (jqXHR, textStatus, errorThrown) {
                mensagemErro("Erro ao Carregar Contas a pagar");
              },
              dataType: "json",
            });
          }
        });
      }

      $(document).ready(function () {
        carregaClienteToEdit();

        $.ajax({
          type: "GET",
          url: "./api/requisicao/cliente/buscaClientes.php",
          success: function (data) {
            const jsonData = JSON.parse(data);

            jsonData.forEach((cliente) => {
              $("#listaClientesCadastrados").html(
                $("#listaClientesCadastrados").html() +
                  "" +
                  "<tr>" +
                  '    <th scope="row">' +
                  cliente.id +
                  "</th>" +
                  "    <td>" +
                  cliente.nome +
                  "</td>" +
                  "    <td>" +
                  cliente.cpfCnpj +
                  "</td>" +
                  "<td>" +
                  "<button title='Editar Registro' style='margin-right: 10%;' class='btn btn-success' onclick='edicao(" +
                  cliente.id +
                  ")'><i class='fa-solid fa-pen-to-square' style='color: white'></i></button>" +
                  "</td>" +
                  "</tr>" +
                  "",
              );
            });
          },
          error: function (jqXHR, textStatus, errorThrown) {
            mensagemErro("Erro ao Carregar Clientes");
          },
          dataType: "json",
        });
      });
    </script>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mt-3 page-title">Clientes</h1>
      <form class="needs-validation mt-5" novalidate>
        <div class="row">
          <div class="col-sm-12 col-md-2">
            <div class="mb-3 form-group">
              <label for="codigo" class="form-label">Código</label>
              <input
                type="text"
                class="form-control"
                id="codigo"
                name="codigo"
                readonly
              />
            </div>
          </div>
          <div class="col-sm-12 col-md-5">
            <div class="mb-3 form-group">
              <label for="nome" class="form-label">Nome</label>
              <input
                type="text"
                class="form-control"
                id="nome"
                name="nome"
                placeholder="Nome do cliente"
                required
              />
              <div class="invalid-feedback">
                Por favor, insira o nome do cliente.
              </div>
            </div>
          </div>
          <div class="col-sm-12 col-md-5">
            <div class="mb-3 form-group">
              <label for="cpfCnpj" class="form-label">CPF/CNPJ</label>
              <input
                type="text"
                class="form-control"
                id="cpfCnpj"
                name="cpfCnpj"
                placeholder="CPF ou CNPJ do cliente"
                required
              />
              <div class="invalid-feedback">
                Por favor, insira o CPF ou CNPJ do cliente.
              </div>
            </div>
          </div>
          <div class="col-12">
            <div class="mb-3 form-group">
              <label for="observacao" class="form-label">Observação</label>
              <textarea
                class="form-control"
                id="observacao"
                name="observacao"
                rows="3"
                placeholder="Digite alguma observação sobre o cliente"
              ></textarea>
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-between">
          <button type="submit" id="botaoSubmit" class="btn btn-primary">
            Cadastrar
          </button>

          <button
            type="button"
            id="botaoNovo"
            class="btn btn-secondary"
            onclick="telaCadatro()"
          >
            Novo
          </button>
        </div>
      </form>
    </div>

    <div class="container mt-5">
      <table class="table border">
        <thead>
          <tr>
            <th scope="col">Codigo</th>
            <th scope="col">Nome</th>
            <th scope="col">CPF/CNPJ</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="listaClientesCadastrados">
          <!-- Montado no .ready da Pagina -->
        </tbody>
      </table>
    </div>

    <script>
      (function () {
        "use strict";

        var forms = document.querySelectorAll(".needs-validation");

        Array.prototype.slice.call(forms).forEach(function (form) {
          form.addEventListener(
            "submit",
            function (event) {
              var cpfCnpj = $("#cpfCnpj").val().replace(/\D/g, "");
              var isCpfCnpjValid = cpfCnpj.length == 11 || cpfCnpj.length == 14;
              if (!form.checkValidity() || !isCpfCnpjValid) {
                event.preventDefault();
                event.stopPropagation();
              } else {
                event.preventDefault();
                var formData = $(form).serialize();

                $.ajax({
                  type: "POST",
                  url: "./api/requisicao/cliente/cadastroAtualizaCliente.php",
                  data: formData,
                  success: function (data) {
                    data = JSON.parse(data);

                    Swal.fire({
                      position: "top-end",
                      icon: "success",
                      title: "Salvo Com Sucesso",
                      showConfirmButton: false,
                      timer: 1500,
                    });

                    if (data.id) {
                      setTimeout(function () {
                        location.reload();
                      }, 1500);
                    }
                  },
                  error: function (jqXHR, textStatus, errorThrown) {
                    mensagemErro(jqXHR.responseText);
                  },
                });
              }
              form.classList.add("was-validated");
            },
            false,
          );
        });
      })();

      $(document).ready(function () {
        $("#cpfCnpj").inputmask({
          mask: ["999.999.999-99", "99.999.999/9999-99"],
          keepStatic: true,
        });

        $("#cpfCnpj").on("input", function () {
          var value = $(this).val().replace(/\D/g, "");
          if (value.length === 11 || value.length === 14) {
            $(this).removeClass("is-invalid");
            $(this).addClass("is-valid");
          } else {
            $(this).removeClass("is-valid");
            $(this).addClass("is-invalid");
          }
        });
      });
    </script>
  </body>
</html>
